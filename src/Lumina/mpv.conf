# Lumina baseline. Tuned for broadcast .ts (1080i, rough timestamps) and HDR.
vo=gpu-next
gpu-api=d3d11
hwdec=d3d11va,d3d11va-copy
# Keep the picture in step with the sound. "display-resample" redraws on every screen refresh, which on a 120 Hz screen is five times the graphics work for
# 24 fps film, and it cannot lock at 1.5x or 1.7x speed. On this PC that was the cause of stutter at 4K, in HDR, and at higher speeds.
video-sync=audio
interpolation=no
deinterlace=auto

# Tolerate damaged or odd TS: probe longer, buffer bursts.
demuxer-lavf-probesize=50000000
demuxer-lavf-analyzeduration=10
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=64MiB
cache=yes

hdr-compute-peak=yes

# Scaling that a busy PC can keep up with. mpv's default filters are heavy: on a shared-memory GPU with other programs running they made frames miss
# their vsync and the picture stutter. Bilinear is what VLC's Direct3D output does too. Settings, Video, Picture scaling can raise it.
scale=bilinear
cscale=bilinear
dscale=bilinear
dither=no
correct-downscaling=no
sigmoid-upscaling=no
target-colorspace-hint=yes

input-default-bindings=yes
input-vo-keyboard=yes
# Holding the left button must stay with the controller (a drag on the seek bar or volume); mpv would otherwise start dragging its window
window-dragging=no
keep-open=yes
save-position-on-quit=no

# Sidecar subtitle files next to the video load automatically.
sub-auto=fuzzy

# Lumina draws its own controller (scripts/lumina-osc.lua), so the stock one is off.
osc=no
osd-bar=no
# The controller draws every on-screen note itself (see lumina-osc.lua), so mpv's own text banner is off.
osd-level=0

# On-screen messages and subtitles in Lumina's type and colours.
osd-font=Segoe UI Variable Text
osd-font-size=34
osd-color=#ECEEF2
osd-border-style=background-box
osd-back-color=#CC0C0D10
osd-border-size=8
osd-margin-x=36
osd-margin-y=36

sub-font=Segoe UI Semibold
sub-font-size=46
sub-color=#FFFFFF
sub-border-size=2.2
sub-border-color=#E6000000
sub-shadow-offset=1
sub-margin-y=44

# Media keys and the Windows "Now playing" overlay (System Media Transport Controls), handled by mpv itself.
media-controls=yes
