# Up and down change the volume (mpv would seek a minute); Shortcuts.cs has the same keys so Settings can rebind them
UP script-message lumina-volume 5
DOWN script-message lumina-volume -5
# Speed goes up and down in plain steps of 0.1 (1.0, 1.1, 1.2) rather than by 10% of the current speed
] script-message lumina-speed 0.1
[ script-message lumina-speed -0.1
# As in VLC: C cycles the crop ratio, A the aspect ratio
c script-message lumina-do crop
a script-message lumina-do aspect
v script-message lumina-cycle sub
b script-message lumina-cycle audio
Ctrl+b script-message lumina-subs
f script-message lumina-fullscreen
F11 script-message lumina-fullscreen
ESC script-message lumina-exit-fullscreen
N script-message lumina-next
P script-message lumina-prev
# Hardware and overlay media buttons. Lumina owns the queue and the episode order, so these go to the host.
NEXT script-message lumina-next
PREV script-message lumina-prev
# Skipping goes through the controller so the skip amount in Settings applies. Holding the key repeats.
LEFT repeatable script-message lumina-skip -1
RIGHT repeatable script-message lumina-skip 1
# Hide or show the on-screen controls (they stay out of the way until the same key is pressed again).
h script-message lumina-do hide-ui
# Add a bookmark at this moment; press it again at the same spot to remove it.
y script-message lumina-bookmark
# Shrink to a small always-on-top window, and back.
w script-message lumina-miniplayer
